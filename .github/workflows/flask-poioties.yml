name: Flask Poioties CI

on:
  push:
    branches: ["main", "develop"]
    paths: ["api/**", "test/**", "alembic/**"]
  pull_request:
    branches: ["main", "develop"]
    paths: ["api/**", "test/**", "alembic/**"]

permissions:
  contents: read

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    env:
      DB_TYPE: postgresql  
      DB_USER: ${{ vars.NAME }}     
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_NAME: ${{ vars.NAME }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      SALT: ${{ secrets.SALT }}
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      MAIL_FROM: ${{ vars.NAME }}
      MAIL_PORT: ${{ vars.MAIL_PORT }}
      MAIL_SERVER: ${{ vars.MAIL_SERVER }}
      MAIL_USE_TLS: ${{ vars.MAIL_USE_TLS }}
      MAIL_USE_SSL: ${{ vars.MAIL_USE_SSL }}
      MAIL_DEFAULT_SENDER: ${{ vars.MAIL_DEFAULT_SENDER }}
      EMAIL_SENDER: ${{ vars.NAME }}
      SQLALCHEMY_DATABASE_URI: "postgresql://$DB_USER:$DB_PASSWORD@$DB_HOST/$DB_NAME"

    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      
      - name: Check Environment Variables
        run: |
          echo "DB_TYPE: $DB_TYPE"
          echo "DB_USER: $DB_USER"
          echo "DB_NAME: $DB_NAME"
          echo "SQLALCHEMY_DATABASE_URI: $SQLALCHEMY_DATABASE_URI"
          echo "MAIL_USERNAMEL: $MAIL_USERNAME"

      - name: Verify DB_TYPE
        run: echo "DB_TYPE is set to $DB_TYPE"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black pytest

      - name: Run Tests
        env:
          DB_TYPE: postgresql
          SQLALCHEMY_DATABASE_URI: "postgresql://$DB_USER:$DB_PASSWORD@$DB_HOST/$DB_NAME"
        run: |
          pytest tests/

      - name: Check code Format with Black
        run: |
          black --check .

      - name: Run autopep8
        run: |
          autopep8 --in-place --aggressive --recursive .
