<!DOCTYPE html>
<html lang="en">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>{% block title %}{% endblock %}</title>
  </head>
  <body style="margin: 0; padding: 0; font-family: Arial, sans-serif;">

      <!-- Header -->
      <table role="presentation" width="100%" style="background-color: #FDEADC; height: 7.625rem; text-align: center;">
          <tr>
              <td style="text-align: center; background-color: #3ecff7;">
                  <div style="display: inline-block; height: 80px; width: 100px; overflow: hidden; background-size: cover;">
                        <img src="">
                  </div>
              </td>
          </tr>
      </table>

      {% block content %} {% endblock %}

      <!-- Footer -->
      <table role="presentation" width="100%" style="background-color: #F3EFEE; padding: 1rem 2rem;">
          <tr>
              <td style="text-align: center;">
                <div style="display: inline-block;">
                    <a href="https://x.com/poioties" style="margin-right: 10px;">
                        <img src="" alt="xtwitter" style="height: 24px; width: 24px;">
                    </a>
                    <a href="#" style="margin-right: 10px;">
                        <img src="" alt="instagram" style="height: 24px; width: 24px;">
                    </a>
                    <a href="https://www.linkedin.com/company/poioties/" style="margin-right: 10px;">
                        <img src="" alt="linkedin" style="height: 24px; width: 24px;">
                    </a>
                </div>
                
                <div style="text-align: justify;">
                    <p style="color: #5B5B5D; font-size: 0.875rem; font-weight: 400; margin: 1.5rem 0">Thank you for choosing Poioties. Need help? <a href="" style="color: #111; font-weight: 600; text-decoration: underline;">Contact our customer support</a></p>
                    <hr style="border: 1px dashed #969696; margin-bottom: 1.5rem;">
                    <p style="color: #5B5B5D; font-size: 0.875rem; font-weight: 400;">You are receiving this email because you signed up at Poioties. Want to change how you receive these emails? <a href="{{unsubscribe_link}}" style="color: #111; font-weight: 600; text-decoration: none;">Update your preferences</a> or <a href="{{unsubscribe_link}}" style="color: #111; font-weight: 600; text-decoration: none;">unsubscribe from this list.</a></p>
                </div>
              </td>
          </tr>
      </table>
  </body>
</html>
